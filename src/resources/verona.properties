# Single source of truth for the app build, used both locally and on the
# BestQ remote grid.
# Local (emulator) runs: APK looked for at apps/<app.file.name> first; if
# missing there, downloaded from app.download.url and cached at that path.
# Remote-grid runs: passed straight to BestQ's server as the app capability
# (it can't reach this machine's filesystem, so it must fetch the build
# itself) — leave app.remote.url blank instead if the app is already
# installed on the target device via the BestQ dashboard.
