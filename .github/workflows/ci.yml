name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Only one physical device (browser_caps.device in verona.properties) backs
# these tests on the BestQ grid, so serialize runs instead of letting
# concurrent workflows fight over the same device session.
concurrency:
  group: bestq-device
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          server-id: bestq
          server-username: BESTQ_NEXUS_USERNAME
          server-password: BESTQ_NEXUS_PASSWORD

      # app.remote.url (the CloudFront build link) is already the tracked
      # default in verona.properties, so nothing app-specific to pass here.
      - name: Run tests against BestQ remote device
        env:
          BESTQ_NEXUS_USERNAME: ${{ secrets.BESTQ_NEXUS_USERNAME }}
          BESTQ_NEXUS_PASSWORD: ${{ secrets.BESTQ_NEXUS_PASSWORD }}
        # Grid credentials are passed as -D system properties (never written to
        # disk) so verona.local.properties, which holds them for local dev,
        # never has to exist in CI.
        run: |
          mvn -B test -Dtnt.use.local.grid=true -Dplatform=android \
            -Dtnt.local.grid.user="${{ secrets.TNT_LOCAL_GRID_USER }}" \
            -Dtnt.local.grid.password="${{ secrets.TNT_LOCAL_GRID_PASSWORD }}"

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports
          retention-days: 14
