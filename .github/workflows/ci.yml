name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  # Release tag the APK is uploaded to (see README-style notes in this file
  # for how to publish/update it) and the asset name within that release.
  APP_RELEASE_TAG: app-build
  APP_ASSET_NAME: verona-staging.apk

# Only one physical device (browser_caps.device in verona.properties) backs
# these tests on the BestQ grid, so serialize runs instead of letting
# concurrent workflows fight over the same device session.
concurrency:
  group: bestq-device
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          server-id: bestq
          server-username: BESTQ_NEXUS_USERNAME
          server-password: BESTQ_NEXUS_PASSWORD

      # The repo is public, so a Release asset's download URL is a stable,
      # unauthenticated link BestQ's server can fetch directly — no
      # per-run API/token dance needed.
      - name: Run tests against BestQ remote device
        env:
          BESTQ_NEXUS_USERNAME: ${{ secrets.BESTQ_NEXUS_USERNAME }}
          BESTQ_NEXUS_PASSWORD: ${{ secrets.BESTQ_NEXUS_PASSWORD }}
        # Grid credentials are passed as -D system properties (never written to
        # disk) so verona.local.properties, which holds them for local dev,
        # never has to exist in CI.
        run: |
          mvn -B test -Dtnt.use.local.grid=true -Dplatform=android \
            -Dtnt.local.grid.user="${{ secrets.TNT_LOCAL_GRID_USER }}" \
            -Dtnt.local.grid.password="${{ secrets.TNT_LOCAL_GRID_PASSWORD }}" \
            -Dapp.remote.url="https://github.com/${{ github.repository }}/releases/download/${{ env.APP_RELEASE_TAG }}/${{ env.APP_ASSET_NAME }}"

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports
          retention-days: 14
